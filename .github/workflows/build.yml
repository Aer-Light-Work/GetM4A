name: Build LGPL packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync

      - name: Build package (downloads and verifies LGPL ffmpeg)
        run: uv run python build.py

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../GetM4A-${RUNNER_OS}.zip" GetM4A
          else
            zip -qr "../GetM4A-${RUNNER_OS}.zip" GetM4A
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GetM4A-${{ runner.os }}
          path: GetM4A-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GetM4A-*.zip