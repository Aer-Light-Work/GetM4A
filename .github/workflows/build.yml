name: Build LGPL packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync

      - name: Build LGPL FFmpeg from source (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lame nasm
          mkdir -p "$RUNNER_TEMP/pc"
          cat > "$RUNNER_TEMP/pc/libmp3lame.pc" <<EOF
          prefix=$(brew --prefix lame)
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: libmp3lame
          Description: MP3 encoder library
          Version: 3.100
          Cflags: -I\${includedir}
          Libs: -L\${libdir} -lmp3lame
          EOF
          export PKG_CONFIG_PATH="$RUNNER_TEMP/pc:$PKG_CONFIG_PATH"
          git clone --depth 1 --branch n7.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure --prefix="$RUNNER_TEMP/ffmpeg-lgpl" \
            --enable-libmp3lame --disable-doc --disable-ffplay \
            --disable-network --disable-autodetect
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cp COPYING.LGPLv2.1 "$RUNNER_TEMP/ffmpeg-lgpl/LICENSE.txt"
          echo "GETM4A_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-lgpl" >> "$GITHUB_ENV"

      - name: Build package (prepares and verifies LGPL ffmpeg)
        run: uv run python build.py

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../GetM4A-${RUNNER_OS}.zip" GetM4A
          else
            zip -qr "../GetM4A-${RUNNER_OS}.zip" GetM4A
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GetM4A-${{ runner.os }}
          path: GetM4A-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GetM4A-*.zip